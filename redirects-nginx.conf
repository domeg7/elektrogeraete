# die-elektroheizungen.ch — Go-Live-Redirects (nginx)
# In den server-Block der Site einfügen.
# Kanonische Domain: https://die-elektroheizungen.ch (non-www, wie bisher)
#
# Zusätzlich nötig: ein eigener server-Block, der http:// und
# https://www.die-elektroheizungen.ch per 301 auf
# https://die-elektroheizungen.ch$request_uri umleitet.

# Entfernte bzw. konsolidierte Seiten der alten WordPress-Site
location = /monoblock-warmepumpe-x-one/ { return 301 /; }
location = /kontakt-direktheizung/      { return 301 /kontakt/; }
location = /kontakt-speicherheizgeraet/ { return 301 /kontakt/; }
location = /kontakt-x-one/              { return 301 /kontakt/; }
location = /welcome/                    { return 301 /; }

# PDF ist umgezogen (alter WordPress-Upload-Pfad)
location = /wp-content/uploads/2023/09/PRO-Elektroheizungen.pdf {
    return 301 /assets/PRO-Elektroheizungen.pdf;
}

# Alte Yoast-Sitemap auf die neue statische Sitemap
location = /sitemap_index.xml { return 301 /sitemap.xml; }
location = /page-sitemap.xml  { return 301 /sitemap.xml; }
